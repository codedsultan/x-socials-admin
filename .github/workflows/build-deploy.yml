name: Build & Deploy

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # # ────────────────────────────────────────────────────────────────
  # # 1. CI — PHP lint, types, Pest tests
