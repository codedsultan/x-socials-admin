  #     - name: Copy env for tests
  #       run: cp .env.example .env && php artisan key:generate

  #     - name: Run Pest tests
  #       run: php artisan test --coverage --min=70

  # ────────────────────────────────────────────────────────────────
  # 2. Build & Push Docker image
  # ────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    # needs: test
    # if: needs.test.result == 'success'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/x-socials-admin

    outputs:
      image_tag:   ${{ steps.tags.outputs.deploy_tag }}
      environment: ${{ steps.env.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "deploy_tag=${{ github.sha }}"             >> $GITHUB_OUTPUT
            echo "all_tags=${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.IMAGE_NAME }}:${SHORT_SHA}" >> $GITHUB_OUTPUT

          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "deploy_tag=develop-${SHORT_SHA}"         >> $GITHUB_OUTPUT
            echo "all_tags=${{ env.IMAGE_NAME }}:develop,${{ env.IMAGE_NAME }}:develop-${SHORT_SHA},${{ env.IMAGE_NAME }}:develop-${{ github.sha }}" >> $GITHUB_OUTPUT

          else
            # Pull requests — build only, no push
            echo "deploy_tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "all_tags=${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    ./Dockerfile
          target:  production
          push:    ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
          tags:    ${{ steps.tags.outputs.all_tags }}
          build-args: |
            PHP_VERSION=8.4
            VITE_APP_NAME=${{ vars.APP_NAME || 'X-Socials Admin' }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Image build summary
        run: |
          echo "## 🐘 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy tag:** \`${{ steps.tags.outputs.deploy_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Stack:** PHP-FPM + Nginx (port 8080), SQLite, Redis queues" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────
  # 3. Trigger Ansible deployment
  # ────────────────────────────────────────────────────────────────
  trigger-deployment:
    name: Trigger Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      github.event_name == 'push' &&
      needs.build-and-push.outputs.environment != '' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Dispatch to infra repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token:          ${{ secrets.INFRA_REPO_PAT }}
          repository:     codedsultan/x-infra-socials-admin
          event-type:     deploy-app
          client-payload: |
            {
              "environment":    "${{ needs.build-and-push.outputs.environment }}",
              "tag":            "${{ needs.build-and-push.outputs.image_tag }}",
              "commit_sha":     "${{ github.sha }}",
              "commit_message": "${{ github.event.head_commit.message }}",
              "triggered_by":   "${{ github.actor }}",
              "repo":           "${{ github.repository }}",
              "run_id":         "${{ github.run_id }}"
            }
